<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Hub · 個人資訊中樞</title>
<style>
:root{
  --bg:#f5eee3;--bg2:#ece2d3;--card:#fffaf2;--card2:#fbf3e6;--line:#e2d3bd;
  --txt:#3d2e23;--sub:#76604c;--mut:#a68f78;--brown:#8b5e3c;
  --en:#4f7489;--ja:#b05d6f;--anime:#c0663f;--comic:#3f8a86;--games:#6f8a3a;--novel:#c08a1e;--news:#7b5a8a;--dict:#8b5e3c;--vocab:#5c7a5a;
  --gold:#c08a1e;--r:14px;--sh:0 2px 10px rgba(110,80,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
a{color:var(--en)}
button,input,select,textarea{font:inherit;color:inherit}
.preview-bar{background:#8b5e3c;color:#fff8ec;font-size:12.5px;padding:7px 14px;text-align:center}
.preview-bar b{color:#ffe0a3}
.app{display:flex;min-height:calc(100vh - 32px)}
.side{width:214px;flex:0 0 214px;background:var(--bg2);border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-size:19px;font-weight:800;padding:4px 10px 14px;color:var(--brown)}
.logo small{display:block;font-size:11px;color:var(--mut);font-weight:400;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;cursor:pointer;text-align:left;color:var(--sub)}
.nav-btn:hover{background:var(--card2)}
.nav-btn.on{background:var(--card);color:var(--brown);font-weight:700;box-shadow:var(--sh)}
.nav-btn .ic{width:20px;text-align:center}
.nav-btn .n{margin-left:auto;font-size:11px;color:var(--mut)}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.main{flex:1;min-width:0;padding:16px 22px 90px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:20px;margin:0;color:var(--brown)}
.top .upd{font-size:12px;color:var(--mut)}
.search{flex:1;min-width:200px;position:relative;margin-left:auto;max-width:420px}
.search input,.inp{width:100%;padding:10px 12px 10px 34px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;outline:none}
.inp{padding-left:12px}
.search input:focus,.inp:focus{border-color:var(--brown)}
.search::before{content:"🔎";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.st{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);cursor:pointer}
.st.on{color:#fff;font-weight:700;border-color:transparent;background:var(--c,var(--brown))}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:12.5px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--c,var(--brown));border-color:transparent;color:#fff;font-weight:600}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.chip.on .dot{background:#fff}
.lbl{font-size:12px;color:var(--mut);margin:0 2px 0 6px}
.pager{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px}
.pager button{border:none;background:none;cursor:pointer;padding:5px 9px;border-radius:7px;color:var(--sub)}
.pager button:hover{background:var(--bg2)}
.pager button:disabled{opacity:.3;cursor:default}
.pager .d{min-width:118px;text-align:center;font-weight:700;font-size:13px}
.cnt{margin-left:auto;color:var(--mut);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px 11px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card .k{font-size:11px;color:var(--mut);letter-spacing:.5px;margin-bottom:3px}
.card h3{margin:0 0 4px;font-size:16px;line-height:1.4;padding-right:30px}
.card h3 small{font-size:12px;color:var(--mut);font-weight:400}
.card .meta{font-size:12.5px;color:var(--sub);margin-bottom:6px}
.card .desc{font-size:13.3px;line-height:1.7;margin:5px 0 8px}
/* 圖片 */
.media{display:flex;gap:12px;align-items:flex-start}
.media .mt{flex:1;min-width:0}
.cover{flex:0 0 98px;width:98px;aspect-ratio:3/4;border-radius:10px;object-fit:cover;background:var(--bg2);cursor:zoom-in;box-shadow:0 2px 8px rgba(60,40,20,.18)}
.banner{width:calc(100% + 30px);margin:-14px -15px 10px;aspect-ratio:16/7;object-fit:cover;display:block;cursor:zoom-in;background:var(--bg2)}
.shots{display:flex;gap:6px;margin:6px 0}
.shots img{flex:1;min-width:0;aspect-ratio:16/9;object-fit:cover;border-radius:7px;cursor:zoom-in;background:var(--bg2)}
.imgsrc{font-size:10.5px;color:var(--mut);margin-top:-4px;margin-bottom:6px}
.lightbox{position:fixed;inset:0;background:rgba(40,28,18,.86);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;padding:20px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:min(92vw,900px);max-height:80vh;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.lightbox div{color:#fff8ec;margin-top:10px;font-size:13px}
.bd{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 6px}
.b{font-size:11.5px;padding:2px 8px;border-radius:7px;background:var(--bg2);color:var(--sub)}
.b.c{background:var(--c);color:#fff;font-weight:600}
.b.soft{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--c);font-weight:600}
.b.new{background:#c0392b;color:#fff;font-weight:700}
.b.up{background:#e6efd9;color:#4d6b23}
.b.pick{background:#f6e3b4;color:#8a5f00}
.lk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.lk a,.lk button,.mini{font-size:12px;padding:3px 9px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);text-decoration:none;color:var(--brown);cursor:pointer;white-space:nowrap}
.mini.added{background:#e3ecdc;color:#4d6b23;border-color:#c9dbbd}
.pts{margin:4px 0 6px;padding-left:18px;font-size:13px;line-height:1.65}
.pts li{margin-bottom:2px}
.ptitle{font-size:12px;font-weight:700;color:var(--c);margin-top:6px}
.info{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.8px;margin:6px 0;background:var(--card2);border-radius:9px;padding:8px 10px}
.info dt{color:var(--mut);white-space:nowrap}
.info dd{margin:0}
.more{font-size:12px;color:var(--brown);cursor:pointer;background:none;border:none;padding:0;font-weight:600}
.full{display:none;margin-top:6px;padding:9px 11px;background:var(--card2);border-radius:9px;font-size:13px;line-height:1.75}
.card.open .full{display:block}
.fav{position:absolute;top:9px;right:9px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--mut);line-height:1;z-index:2}
.fav.on{color:var(--gold)}
.banner~.fav,.card.g .fav{background:rgba(255,250,242,.85);border-radius:50%;width:30px;height:30px}
.foot{font-size:11px;color:var(--mut);margin-top:7px;display:flex;justify-content:space-between}
.sec{display:flex;align-items:center;gap:8px;margin:22px 0 10px}
.sec h2{font-size:16px;margin:0;color:var(--brown)}
.sec .go{margin-left:auto;font-size:12.5px;color:var(--brown);cursor:pointer;background:none;border:none}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pick{background:linear-gradient(135deg,#fbecd0,#f6e0c8);border:1px solid #e8c99a;border-radius:var(--r);padding:13px 14px;position:relative;box-shadow:var(--sh)}
.pick .no{position:absolute;right:12px;top:6px;font-size:32px;font-weight:900;color:rgba(139,94,60,.18)}
.pick h3{margin:4px 0 6px;font-size:15px;line-height:1.45;padding-right:30px}
.pick ul{margin:0;padding-left:17px;font-size:12.8px;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:11px;cursor:pointer;box-shadow:var(--sh)}
.stat .v{font-size:22px;font-weight:800;color:var(--c)}
.stat .l{font-size:12px;color:var(--sub)}
.stat .d{font-size:11px;color:var(--mut)}
.empty{padding:50px 10px;text-align:center;color:var(--mut)}
mark{background:#f7d98b;color:inherit;border-radius:3px;padding:0 1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);position:relative}
.panel h3{margin:0 0 10px;font-size:15px;color:var(--brown)}
.panel h4{margin:14px 0 6px;font-size:13.5px}
.panel p{margin:4px 0 8px;line-height:1.7;color:var(--sub);font-size:13px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-weight:600;background:var(--card2)}
table.t td.w{cursor:pointer;color:var(--brown);font-weight:600}
table.t td.w:hover{text-decoration:underline}
table.t td.act{white-space:nowrap;width:1%}
.tagw{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#e7e0f0;color:#5d4a7a;margin-right:4px}
.tags{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#e3ecdc;color:#4d6b23;margin-right:4px}
.scroll{overflow-x:auto}
.panel code,.panel pre{font-family:Consolas,monospace;font-size:12.5px}
.panel pre{background:var(--card2);padding:10px 12px;border-radius:9px;overflow:auto;line-height:1.55;margin:0}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .box{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12.5px;line-height:1.5}
.flow .box b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--brown)}
.flow .arr{align-self:center;color:var(--mut);font-size:18px}
.ok{color:var(--games);font-weight:700} .q{color:var(--gold);font-weight:700} .ng{color:#b0413e;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px;align-items:center}
.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.btn.pri{background:var(--brown);color:#fff;border-color:transparent;font-weight:600}
.btn.grn{background:var(--vocab);color:#fff;border-color:transparent;font-weight:600}
.btn:hover{border-color:var(--brown)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.dictsites{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.def{border-left:4px solid var(--c);padding:8px 12px;background:var(--card2);border-radius:0 9px 9px 0;margin:8px 0}
.def .pos{display:inline-block;font-size:11.5px;background:var(--c);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px}
.conj{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-top:10px}
.conj div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.conj small{display:block;color:var(--mut);font-size:11.5px}
.conj b{font-size:16px}
.say{border:none;background:none;cursor:pointer;font-size:14px;padding:0 3px}
/* 單字庫 */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:11px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;box-shadow:var(--sh);border-left:5px solid var(--c)}
.vc .term{font-size:17px;font-weight:700}
.vc .rd{font-size:12px;color:var(--mut);margin-left:6px}
.vc .mn{font-size:13.3px;margin:4px 0}
.vc .ex{font-size:12.5px;color:var(--sub);background:var(--card2);border-radius:8px;padding:6px 8px;margin:5px 0}
.vc .row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.lv{font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.lv.on.l0{background:#c0663f;color:#fff;border-color:transparent}
.lv.on.l1{background:#c08a1e;color:#fff;border-color:transparent}
.lv.on.l2{background:#5c7a5a;color:#fff;border-color:transparent}
.flash{max-width:520px;margin:10px auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:34px 24px;text-align:center;box-shadow:var(--sh)}
.flash .ft{font-size:30px;font-weight:800;margin-bottom:6px}
.flash .fb{display:none;margin-top:14px;font-size:15px;line-height:1.7}
.flash.show .fb{display:block}
.form2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#3d2e23e6;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;display:none;z-index:99}
.bnav{display:none}
@media(max-width:820px){
  .side{display:none}
  .main{padding:12px 12px 90px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:50;padding:4px 2px env(safe-area-inset-bottom);overflow-x:auto}
  .bnav button{flex:0 0 auto;min-width:56px;border:none;background:none;color:var(--mut);font-size:10.5px;padding:6px 4px;cursor:pointer}
  .bnav button .ic{display:block;font-size:19px}
  .bnav button.on{color:var(--brown);font-weight:700}
  .grid{grid-template-columns:1fr}
  .search{max-width:none;order:3;flex-basis:100%}
  .cover{flex-basis:84px;width:84px}
}

/* v4 */
.search{display:flex;align-items:stretch;gap:0;max-width:520px}
.search::before{content:none}
.search select{border:1px solid var(--line);border-right:none;border-radius:10px 0 0 10px;background:var(--card2);padding:0 8px;font-size:13px;color:var(--brown);max-width:150px;outline:none}
.search input{border-radius:0 10px 10px 0;padding-left:12px}
.search .qgo{border:1px solid var(--line);border-left:none;background:var(--brown);color:#fff;border-radius:0 10px 10px 0;padding:0 12px;cursor:pointer}
.search:has(.qgo[style=""]) input{border-radius:0}
.panel.coll .ph{cursor:pointer;user-select:none;padding-right:34px}
.panel.coll .chev{display:inline-block;width:18px;color:var(--mut)}
.panel.coll.closed{padding-bottom:6px}
.panel.coll.closed .pb{display:none}
.panel.coll>.fav{top:12px;right:12px}
table.lim tr.x{display:none}
table.lim.filtering tr.x{display:table-row}
.lexbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--sub);background:var(--card2);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.eword{font-size:22px;font-weight:800}
.eph{color:var(--mut);font-size:14px}
.eforms{font-size:12.5px;color:var(--sub);margin-bottom:8px}
.sense{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
.sense .sn{flex:0 0 26px;height:26px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brown);font-size:13px}
.sense .sbody{flex:1;min-width:0;font-size:13.5px;line-height:1.6}
.sense .pos{display:inline-block;font-size:11.5px;background:var(--c);color:#fff;border-radius:6px;padding:1px 7px;margin-right:6px}
.sense .szh{font-size:15px}
.sense .sdef{color:var(--sub);font-size:12.5px}
.sense .sex{background:var(--card2);border-radius:8px;padding:6px 9px;margin:5px 0;font-size:13px}
.sense .sex div{color:var(--sub);font-size:12.5px}
.sense .srow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.scene{font-size:11.5px;background:#f3e6cf;color:#8a5f00;border-radius:6px;padding:2px 8px}
.srcline{font-size:11px;color:var(--mut);margin-top:8px}
.hint{background:#fbf0dc;border:1px solid #ecd3a4;border-radius:10px;padding:10px 12px;font-size:12.8px;margin-top:8px;line-height:1.8}
.pat2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wline{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.3px}
.lstar{border:none;background:none;cursor:pointer;font-size:17px;color:var(--mut);line-height:1;padding:0}
.lstar.on{color:var(--gold)}
@media(max-width:820px){.pat2{grid-template-columns:1fr}.search select{max-width:110px}}
</style>
</head>
<body>
<div class="preview-bar" id="seedbar" style="display:none">📦 目前顯示的是<b>範例資料</b>：到 GitHub › Actions 手動執行一次「Sunny Hub 每日更新」，就會換成真實內容。</div>
<div class="app">
  <aside class="side">
    <div class="logo">☀️ Sunny Hub<small>個人資訊中樞 · 語言／ACGN／新聞</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="ttl">首頁</h1>
      <span class="upd" id="upd"></span>
      <div class="search"><select id="qs" title="搜尋範圍"></select><input id="q" type="search" placeholder="本站查詢：作品、作者、文法、標籤、來源…" autocomplete="off"><button id="qgo" class="qgo" style="display:none" title="另開分頁搜尋">↗</button></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="lightbox" id="lb"><img id="lbimg" alt=""><div id="lbcap"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= 設定 ================= */
const PREVIEW = false;   // 正式版改 false → 讀 data/*.json
const MODS = {
  home:{name:"首頁",ic:"🏠"},
  lang:{name:"語言學習",ic:"🗣️",cats:{en:{n:"商用英文",c:"var(--en)"},ja:{n:"日文 商用・JLPT",c:"var(--ja)"}}},
  dict:{name:"字典・文法",ic:"📖"},
  acgn:{name:"ACGN",ic:"🎴",cats:{anime:{n:"動畫",c:"var(--anime)"},comic:{n:"漫畫",c:"var(--comic)"},games:{n:"遊戲",c:"var(--games)"},novel:{n:"小說",c:"var(--novel)"}}},
  news:{name:"ACGN 新聞",ic:"📰",cats:{news:{n:"新聞",c:"var(--news)"}}},
  fav:{name:"珍藏",ic:"★"},
  weekly:{name:"週報",ic:"📊",cats:{weekly:{n:"週報",c:"var(--brown)"}}},
  vocab:{name:"單字庫",ic:"📝"},
  arch:{name:"架構說明",ic:"🧭"},
};
const NEWSC={"動漫":"var(--anime)","漫畫":"var(--comic)","遊戲":"var(--games)","小說":"var(--novel)","業界":"var(--news)"};
const FILTERS = {
  en:{key:"category",opts:["商務Email","會議英文","談判協商","簡報英文","報告撰寫","人脈拓展","商業詞彙","商用慣用語"]},
  ja:{key:"category",opts:["ニュース","文法","語彙","ビジネス","敬語"],key2:"level",lbl2:"JLPT",opts2:[["N1","N1"],["N2","N2"],["N3","N3"]]},
  anime:{key:"season_type",opts:[["current","本季"],["next","下季"],["prev","上季"]]},
  comic:{key:"origin",opts:["日漫","韓漫","連載更新"]},

function viewList(mod){
  const cats=Object.keys(MODS[mod].cats);const cat=cats.includes(S.cat[mod])?S.cat[mod]:cats[0];S.cat[mod]=cat;
  const F=FILTERS[cat],dk=mod+cat,dayIdx=S.day[dk]??-1,cc=MODS[mod].cats[cat].c;
  const opt=o=>Array.isArray(o)?o:[o,o];
  let h=cats.length>1?`<div class="subtabs">${cats.map(c=>`<button class="st ${c===cat?"on":""}" style="--c:${MODS[mod].cats[c].c}" data-cat="${c}">${MODS[mod].cats[c].n}</button>`).join("")}</div>`:"";
  h+=`<div class="bar"><div class="pager"><button data-day="prev" ${dayIdx>=6?"disabled":""}>‹</button><span class="d">${dayIdx<0?"近 7 天全部":days()[dayIdx]+(dayIdx===0?"（今天）":"")}</span><button data-day="next" ${dayIdx<0?"disabled":""}>›</button><button data-day="all" title="近7天全部">⟲</button></div>
    <span class="chip ${!S.f[cat]?"on":""}" data-f="">全部</span>${F.opts.map(o=>{const[v,l]=opt(o);const col=F.colors?F.colors[v]:cc;return`<span class="chip ${S.f[cat]===v?"on":""}" style="--c:${col}" data-f="${esc(v)}">${F.colors?'<span class="dot"></span>':""}${esc(l)}</span>`}).join("")}
    ${F.opts2?`<span class="lbl">${F.lbl2}</span>`+F.opts2.map(o=>{const[v,l]=opt(o);return`<span class="chip ${S.f2[cat]===v?"on":""}" style="--c:${cc}" data-f2="${v}">${l}</span>`}).join(""):""}
    <span class="cnt" id="cnt"></span></div>`;
  let a=DB.items.filter(x=>x.cat===cat).filter(mq);
  if(dayIdx>=0)a=a.filter(x=>x.added===days()[dayIdx]);
  if(S.f[cat])a=a.filter(x=>x[F.key]===S.f[cat]);
  if(S.f2[cat])a=a.filter(x=>x[F.key2]===S.f2[cat]);
  a.sort((x,y)=>y.added.localeCompare(x.added));
  return h+grid(a);
}

    if(!out.senses.some(s=>s.zh)){const t=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(w)}&langpair=${lang}|zh-TW`);if(t.ok){const j=await t.json();out.zh=(j.responseData||{}).translatedText||"";if(out.zh)out.src.push("MyMemory 翻譯")}}

    <select class="inp" id="na-lang"><option value="en">🇺🇸 英文</option><option value="ja">🇯🇵 日文</option></select>

    <input class="inp" id="na-term" placeholder="單字／字詞／句型 *" required><input class="inp" id="na-read" placeholder="讀音／音標">
    <input class="inp" id="na-mean" placeholder="中文意思"><input class="inp" id="na-ex" placeholder="例句"><input class="inp" id="na-note" placeholder="筆記（選填）"></div>
    <div style="margin-top:8px"><button class="btn grn">加入單字庫</button> <button class="btn" type="button" data-vact="form">取消</button></div></form></div>`;

  if(!all.length)return h+`<div class="panel"><p>單字庫還是空的。在字典查詢結果、文法表、句型表、週報或學習卡片上按「＋單字庫」，就會收進這裡；也可以「手動新增」。之後用「🃏 開始複習」做翻卡練習。</p></div>`;

    ${x.meaning?`<div class="mn">${hl(x.meaning)}</div>`:`<div class="mn" style="color:var(--mut)">（尚未填寫意思）</div>`}
    ${x.example?`<div class="ex">${hl(x.example)}</div>`:""}

  const r=await lookup(word,S.dict.lang);if(S.dict.word===word){S.dict.res=r;render()}}
function backup(){return{version:1,exportedAt:new Date().toISOString(),favs,vocab}}
const saveColl=()=>ls.set(LS.coll,S.coll);
document.addEventListener("click",e=>{
  const z=e.target.closest("[data-zoom]");if(z){const lb=document.getElementById("lb");document.getElementById("lbimg").src=z.src;document.getElementById("lbcap").textContent=z.dataset.zoom;lb.classList.add("on");return}
  if(e.target.closest("#lb")){document.getElementById("lb").classList.remove("on");return}
  if(e.target.closest("#qgo")){goExternal();return}
  const t=e.target.closest("[data-fav],[data-addv],[data-say],[data-aireq],[data-lexref],[data-onlynew],[data-coll],[data-collall],[data-more],[data-wsub],[data-dict],[data-go],[data-cat],[data-day],[data-f],[data-f2],[data-open],[data-favcat],[data-act],[data-dtab],[data-dl],[data-wk],[data-openwk],[data-vf],[data-vact],[data-vlv],[data-vdel],[data-vnote],[data-rv]");if(!t)return;
  const d=t.dataset;
  if(d.fav!==undefined){e.stopPropagation();return toggleFav(d.fav)}
  if(d.addv!==undefined){const o=VREG[+d.addv];if(o)addVocab(o);return}
  if(d.say!==undefined)return speak(d.say,d.slang);
  if(d.aireq!==undefined){if(PREVIEW){toast("🤖 已送出 AI 詳解請求（預覽模擬）：正式版約 1～2 分鐘後自動補進字典")}else window.open(issueUrl(`[dict] ${d.aireq} (${d.alang})`,"由 Sunny Hub 發出：請產生此字詞的完整詳解（所有意思、中文、情境、例句）。"),"_blank");return}
  if(d.lexref)return refreshLex(d.lexref);
  if(d.onlynew){S.onlyNew[d.onlynew]=!S.onlyNew[d.onlynew];render();return}
  if(d.coll){S.coll[d.coll]=!S.coll[d.coll];saveColl();render();return}
  if(d.collall!==undefined){PKEYS.forEach(k=>S.coll[k]=d.collall==="1");saveColl();render();return}
  if(d.more){S.more[d.more]=!S.more[d.more];render();return}
  if(d.wsub){S.wsub=d.wsub;render();return}
  if(d.dict!==undefined){e.preventDefault();return openDict(d.dict,d.dlang)}
  if(d.open!==undefined){const cd=t.closest(".card");cd.classList.toggle("open");const o=cd.classList.contains("open");t.textContent=t.textContent.replace(o?"▾":"▴",o?"▴":"▾");return}
  if(d.go){S.mod=d.go;if(d.cat)S.cat[d.go]=d.cat;savePref();render();window.scrollTo(0,0);return}
  if(d.dtab){S.dict.tab=d.dtab;render();return}
  if(d.dl){S.dict.lang=d.dl;S.dict.word="";S.dict.res=null;render();return}
  if(d.wk!==undefined){S.wk=+d.wk;render();return}
  if(d.openwk){S.mod="weekly";S.wk=Math.max(0,DB.weeklies.findIndex(x=>x.id===d.openwk));render();window.scrollTo(0,0);return}
  if(d.vf){S.v[d.vf]=d.vv;render();return}
  if(d.vact){const a=d.vact;if(a==="form")S.v.form=!S.v.form;if(a==="review"){S.v.mode="review";S.v.fi=0;S.v.show=false}if(a==="list")S.v.mode="list";if(a==="flip")S.v.show=true;render();return}
  if(d.vlv){vocab[d.vlv].status=+d.i;ls.set(LS.vocab,vocab);render();return}
  if(d.vdel){if(confirm("從單字庫移除「"+vocab[d.vdel].term+"」？")){delete vocab[d.vdel];ls.set(LS.vocab,vocab);render()}return}
  if(d.vnote){const n=prompt("筆記／中文意思補充：",vocab[d.vnote].note||"");if(n!==null){vocab[d.vnote].note=n;ls.set(LS.vocab,vocab);render()}return}
  if(d.rv){vocab[d.id].status=+d.rv;ls.set(LS.vocab,vocab);if(+d.rv<2)S.v.fi++;S.v.show=false;render();return}
  if(d.cat){S.cat[S.mod]=d.cat;savePref();render();return}
  const cat=S.cat[S.mod],dk=S.mod+cat;
  if(d.day){let i=S.day[dk]??-1;if(d.day==="all")i=-1;else if(d.day==="prev")i=Math.min(6,i+1);else if(d.day==="next")i=i<=0?-1:i-1;S.day[dk]=i;render();return}
  if(d.f!==undefined){S.f[cat]=d.f||"";render();return}
  if(d.f2!==undefined){S.f2[cat]=S.f2[cat]===d.f2?"":d.f2;render();return}
  if(d.favcat){S.favCat=d.favcat;S.wsub="all";render();return}
  if(d.act==="export"){const b=new Blob([JSON.stringify(backup(),null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sunny-hub-backup.json";a.click();toast("已匯出珍藏＋單字庫");return}
  if(d.act==="import"){const i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.favs||j.vocab){Object.assign(favs,j.favs||{});Object.assign(vocab,j.vocab||{})}else Object.assign(favs,j);ls.set(LS.fav,favs);ls.set(LS.vocab,vocab);render();toast("已匯入備份")}catch(x){toast("檔案格式錯誤")}};r.readAsText(i.files[0])};i.click();return}
});
document.addEventListener("submit",e=>{
  e.preventDefault();const id=e.target.id,$=x=>document.getElementById(x).value.trim();
  if(id==="dform"){const w=$("dq");if(w)openDict(w,S.dict.lang)}
  if(id==="vform"){S.verb=$("vq")||"書く";S.vtype=document.getElementById("vt").value;render()}
  if(id==="aform"){S.adj=$("aq")||"高い";render()}
  if(id==="vaddform"){const term=$("na-term");if(!term)return;S.v.form=false;addVocab({lang:document.getElementById("na-lang").value,type:document.getElementById("na-type").value,term,reading:$("na-read"),meaning:$("na-mean"),example:$("na-ex"),note:$("na-note"),src:"手動新增"})}
});
document.addEventListener("change",e=>{
  if(e.target.id==="qs"){S.qs=e.target.value;const ext=S.qs!=="site",q=document.getElementById("q");
    q.placeholder=ext?`輸入關鍵字，按 Enter 在「${QMAP[S.qs][1]}」搜尋（另開分頁）`:"本站查詢：作品、作者、文法、標籤、來源…";
    document.getElementById("qgo").style.display=ext?"":"none";
    if(ext&&S.q){S.q="";render()}else if(!ext){S.q=q.value.trim();render()}q.focus()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")document.getElementById("lb").classList.remove("on");
  if(e.key==="Enter"&&e.target.id==="q"&&S.qs!=="site"){e.preventDefault();goExternal()}
});
document.addEventListener("input",e=>{
  if(e.target.id==="q"){if(S.qs!=="site")return;S.q=e.target.value.trim();render();return}
  const f=e.target.dataset&&e.target.dataset.filter;
  if(f){const q=e.target.value.toLowerCase();const tb=document.getElementById(f);if(tb)tb.classList.toggle("filtering",!!q);document.querySelectorAll("#"+f+" [data-row]").forEach(r=>r.style.display=r.dataset.row.toLowerCase().includes(q)?"":"none")}
  const fc=e.target.dataset&&e.target.dataset.filtercards;
  if(fc){const q=e.target.value.toLowerCase();document.querySelectorAll("."+fc).forEach(r=>r.style.display=r.dataset.row.toLowerCase().includes(q)?"":"none")}
});

async function boot(){
  const J=(p,d)=>fetch(p+"?_="+Date.now()).then(r=>r.ok?r.json():d).catch(()=>d);
  if(PREVIEW){DB=mockData();}
  else{
    const [l,a,n,w,lx,dt,st]=await Promise.all([J("data/lang.json",{items:[]}),J("data/acgn.json",{items:[]}),J("data/news.json",{items:[]}),
      J("data/weekly/index.json",[]),J("data/lexicon.json",null),J("data/dict/detail.json",{}),J("data/status.json",null)]);
    DB={items:[...(l.items||[]),...(a.items||[]),...(n.items||[])],weeklies:Array.isArray(w)?w:[],wparts:[],
        meta:{last_updated:[l,a,n].map(x=>(x.meta||{}).last_updated||"").sort().pop()||""},status:st};
    if(lx&&lx.fam)LEX=Object.assign({famPending:[],jPending:[],updated:{fam:"",jlpt:""}},lx);
    Object.assign(DETAIL,dt||{});
    if([l,a,n].some(x=>(x.meta||{}).seed))document.getElementById("seedbar").style.display="";
  }
  DB.wparts=(DB.weeklies||[]).flatMap(weeklyParts);
  document.getElementById("qs").innerHTML=qsHtml();
  document.getElementById("upd").textContent=DB.meta.last_updated?"更新於 "+new Date(DB.meta.last_updated).toLocaleString("zh-TW",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  render();
}
boot();
