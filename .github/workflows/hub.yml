name: Sunny Hub 每日更新

on:
  schedule:
    # GitHub 使用 UTC。台北 = UTC+8。分鐘設 07 避開整點尖峰（整點排程較容易延遲）。
    # ⚠ 修改這裡時，fetch.py 的 SCHEDULE_MAP 也要改成一樣的字串。
    - cron: "7 1 * * *"     # 台北 09:07 每天：ACGN（動畫/漫畫/遊戲/小說）＋新聞
    - cron: "7 2 * * 1-5"   # 台北 10:07 平日：語言上午場＋字庫＋字典詳解
    - cron: "7 9 * * 1-5"   # 台北 17:07 平日：語言下午場
    - cron: "7 12 * * *"    # 台北 20:07 每天：ACGN 集數/章節更新＋新聞
    - cron: "7 13 * * 0"    # 台北 21:07 週日：週報
  workflow_dispatch:
    inputs:
      modules:
        description: "要執行的模組（all 或逗號分隔：acgn,news,lang:am,lang:pm,lexicon,dict,weekly）"
        default: "all"
        required: false
  issues:
    types: [opened]          # 網頁的「請求 AI 詳解」「從網路抓新的」

permissions:
  contents: write
  issues: write

concurrency:
  group: sunny-hub-data
  cancel-in-progress: false

jobs:
  update:
    # Issue 觸發只接受 repo 擁有者本人，且標題必須是 [dict] 或 [lexicon] 開頭（防止他人濫用你的額度）
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       (startsWith(github.event.issue.title, '[dict]') || startsWith(github.event.issue.title, '[lexicon]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行 Sunny Hub
        env:
          GEMINI_API_KEY: ${{ secrets.ACGN_API }}
          GEMINI_MODEL: gemini-3.8-flash              # 主模型（Google 退役時改這一行）
          GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite # 主模型額度用完或不可用時改用
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODULES: ${{ github.event.inputs.modules }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          HUB_RESULT: ${{ runner.temp }}/hub_result.md
        run: python fetch.py

      - name: 提交資料
        if: always()          # 逾時被砍時也要把已抓到的資料存檔
        run: |
          find data -name "*.tmp" -delete 2>/dev/null || true
          git config user.name  "sunny-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "data: ${{ github.event_name }} $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 7
          done
          exit 1

      - name: 回覆並關閉 Issue
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file ${{ runner.temp }}/hub_result.md || \
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "已執行（詳細結果請看 Actions 紀錄）。"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
