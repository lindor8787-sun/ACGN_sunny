name: 建置離線辭典

# 下載 ECDICT（英中）與 JMdict（日英），轉成網頁可分檔載入的 data/dict/en、data/dict/ja。
# 設定完成後手動執行一次（約 3~8 分鐘）；之後每月 2 日自動更新。
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 1 * *"   # 台北 每月 2 日 02:17

permissions:
  contents: write

concurrency:
  group: sunny-hub-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 建置辭典
        run: python scripts/build_dict.py
      - name: 提交辭典
        run: |
          git config user.name  "sunny-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dict
          if git diff --cached --quiet; then echo "辭典沒有變更"; exit 0; fi
          git commit -m "dict: rebuild $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase --autostash && git push && exit 0; sleep 7; done
          exit 1
