name: 一次性搬移檔案到根目錄

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 搬移到根目錄
        run: |
          shopt -s dotglob nullglob
          if [ ! -d sunny-hub ]; then echo "沒有 sunny-hub 資料夾"; exit 0; fi
          for f in sunny-hub/*; do
            base=$(basename "$f")
            if [ -e "$base" ]; then echo "跳過已存在: $base"; else git mv "$f" .; fi
          done
          rmdir sunny-hub 2>/dev/null || true
          git config user.name  "sunny-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "fix: 把檔案從 sunny-hub/ 搬到根目錄"
          git push
